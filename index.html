<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Enterprise Automation Audit - Interactive Teletype Specification Terminal">
  <title>Enterprise Automation Audit // Specification Intake</title>
  <!-- Custom Google Fonts Collection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playpen+Sans:wght@100..800&family=Redaction:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Outer Viewport Spotlight & Desk Surface -->
  <div class="viewport-wrapper">
    <!-- Main Background Image -->
    <img 
      id="bg-image" 
      class="bg-desk" 
      src="assets/desk_background.png" 
      alt="Creative Studio Desk Background"
    >
    <div class="video-overlay-tint"></div>
    <div class="desk-surface"></div>

    <!-- MAIN APP CONTAINER -->
    <main id="app-container" class="app-container">

      <!-- Top Utility / HUD Header -->
      <header class="top-hud">
        <div class="hud-controls">
          <!-- Glassmorphic Light / Dark Toggle Switch -->
          <button 
            id="glassLightToggle" 
            class="glass-light-toggle is-on" 
            type="button" 
            role="switch" 
            aria-checked="true" 
            aria-label="Toggle Desk Light"
            title="Toggle Desk Illumination (L)"
          >
            <span class="glass-toggle-track">
              <span class="glass-toggle-label glass-label-dark" aria-hidden="true">Dark</span>
              <span class="glass-toggle-knob">
                <span class="knob-lens-caustic" aria-hidden="true"></span>
                <span class="knob-sun-well">
                  <svg class="sun-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2" fill="white" stroke="none" />
                    <line x1="12" y1="2.5" x2="12" y2="4.8" />
                    <line x1="12" y1="19.2" x2="12" y2="21.5" />
                    <line x1="2.5" y1="12" x2="4.8" y2="12" />
                    <line x1="19.2" y1="12" x2="21.5" y2="12" />
                    <line x1="5.3" y1="5.3" x2="6.9" y2="6.9" />
                    <line x1="17.1" y1="17.1" x2="18.7" y2="18.7" />
                    <line x1="5.3" y1="18.7" x2="6.9" y2="17.1" />
                    <line x1="17.1" y1="6.9" x2="18.7" y2="5.3" />
                  </svg>
                </span>
              </span>
              <span class="glass-toggle-label glass-label-light" aria-hidden="true">Light</span>
            </span>
          </button>
        </div>
      </header>

      <!-- Hidden Input for Robust Physical Typing Focus -->
      <input 
        type="text" 
        id="hidden-input" 
        class="hidden-input" 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false" 
        aria-hidden="true" 
      />

      <!-- MAIN STAGE VIEWPORT -->
      <section class="stage-viewport" aria-label="Typewriter Stage">

        <!-- ==============================================================
             PAPER STAGE WRAPPER (Z: 5) - Clamped behind platen roller
             ============================================================== -->
        <div id="paperStage" class="paper-stage">
          <div id="typewriterPaper" class="typewriter-paper paper-resting">
            <div id="paperContent"></div>
            <!-- Platen roller clamping shadow at bottom of paper slot -->
            <div class="paper-platen-clamp" aria-hidden="true"></div>
          </div>
        </div>

        <!-- ==============================================================
             LAYER 2 (Z: 10): VINTAGE WINE-RED ROYAL TYPEWRITER CHASSIS
             (Anchored at bottom 30-35%; Paper lower edge feeds behind platen)
             ============================================================== -->
        <div class="typewriter-stage">
          <div class="typewriter-img-box">
            <!-- Photorealistic Vintage Royal Typewriter Image (Hollow Keyboard Well) -->
            <img 
              src="assets/typewriter-hollow.png" 
              id="typewriter-chassis-img" 
              class="typewriter-chassis-img" 
              alt="Vintage Burgundy Royal Typewriter" 
            />

            <!-- Physical Carriage Return Lever Hotspot -->
            <div id="carriage-lever" class="carriage-lever-hotspot" title="Carriage Return / Feed Lever (Enter)"></div>

            <!-- 3D MECHANICAL KEYBED DECK OVER HOLLOW TRAY -->
            <div id="keyboard-deck" class="keyboard-deck keyboard-hitbox-bed keybed-overlay" aria-label="Typewriter Keyboard">
              <!-- Dynamically populated with 3D mechanical .keycap elements -->
              <div class="spacebar-row flex justify-center items-center mt-2">
                <button id="key-space" class="typewriter-spacebar" data-key=" ">
                  <span class="spacebar-label">SPACE</span>
                </button>
              </div>
            </div>

          </div> <!-- End Typewriter Img Box -->
        </div> <!-- End Typewriter Stage -->

      </section> <!-- End Stage Viewport -->

      <!-- ==============================================================
           FULL-FRAME DESK SPREAD REVIEW (ALL 4 PAPERS TOGETHER)
           ============================================================== -->
      <div id="full-frame-review" class="full-frame-review" role="region" aria-label="Specification Review">
        <div class="review-spread-header">
          <div class="review-title">SPECIFICATION REVIEW // CONFIRM PROJECT PARAMETERS</div>
          <div class="review-subtitle">Verify your workflow requirements below. Click any card to edit before transmitting.</div>
        </div>

        <div class="review-papers-grid">
          <!-- Sheet 1: Core Architecture -->
          <div class="review-sheet sheet-1">
            <div class="review-sheet-inner" id="review-sheet-1"></div>
          </div>

          <!-- Sheet 2: Timeline Velocity -->
          <div class="review-sheet sheet-2">
            <div class="review-sheet-inner" id="review-sheet-2"></div>
          </div>

          <!-- Sheet 3: Capital Allocation -->
          <div class="review-sheet sheet-3">
            <div class="review-sheet-inner" id="review-sheet-3"></div>
          </div>

          <!-- Sheet 4: Dispatch Ledger -->
          <div class="review-sheet sheet-4">
            <div class="review-sheet-inner" id="review-sheet-4"></div>
            <div id="transmitted-stamp" class="transmitted-stamp-overlay">AUDIT QUEUED</div>
          </div>
        </div>

        <div class="review-spread-actions">
          <button id="review-back-btn" class="review-action-btn secondary">← EDIT PARAMETERS</button>
          <button id="review-confirm-btn" class="review-action-btn primary">SUBMIT SPECIFICATION FOR TECHNICAL AUDIT ↵</button>
        </div>
      </div>

      <!-- ==============================================================
           FINAL STEP SUBMISSION: SUMMARY LEDGER MODAL
           ============================================================== -->
      <div id="summary-modal" class="summary-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="dispatch-title">
        <div class="summary-telegram">
          <div class="telegram-stamp">SPECIFICATION RECEIVED // IN ENGINEERING QUEUE</div>

          <div class="summary-telegram-header">
            <div>
              <div id="dispatch-title" class="telegram-title">DISPATCH CONFIRMED</div>
              <div id="ledger-timestamp" class="telegram-meta">DATE: 1954-10-14 // 14:32:08 UTC</div>
              <div class="telegram-meta">DIRECT ENGINEERING REVIEW // STRICT NDA COMPLIANCE</div>
            </div>
          </div>

          <!-- Submitted Records -->
          <div id="ledger-records" class="ledger-records"></div>

          <!-- Actions -->
          <div class="ledger-actions">
            <button id="copy-summary-btn" class="ledger-btn">COPY SUBMISSION SUMMARY</button>
            <button id="new-trans-btn" class="ledger-btn primary">NEW SPECIFICATION</button>
          </div>
        </div>
      </div>

    </main> <!-- End App Container -->
  </div> <!-- End Viewport Wrapper -->

  <script src="assets/sound_data.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
